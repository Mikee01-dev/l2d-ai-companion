<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Companion</title>
    <script src="/live2dcubismcore.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="click-overlay"></div> 

    <div id="drag-area"></div>
    <div id="window-controls">
      <button id="btn-minimize">_</button>
      <button id="btn-close">✕</button>
    </div>

    <div id="persona-switch">
      <button id="btn-male" class="active">Mike</button>
      <button id="btn-female">Kei</button>
    </div>
    
    <div id="lang-switch">
      <button id="btn-lang-id" class="active">ID</button>
      <button id="btn-lang-en">EN</button>
    </div>
    
    <button id="btn-reset-memory">Reset Memori</button>

    <div id="canvas-container"></div>
    
    <div id="speech-bubble" class="hidden">
      <p id="bubble-text"></p>
    </div>
    
    <div id="input-area" class="hidden">
      <input type="text" id="chat-input" placeholder="Type something.." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
