<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Companion</title>
    <script src="/live2dcubismcore.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="click-overlay"></div> 

    <div id="drag-area"></div>
    
    <div id="window-controls">
      <button id="btn-settings">⚙️</button>
      <button id="btn-minimize">_</button>
      <button id="btn-close">✕</button>
    </div>

    <div id="settings-panel" class="hidden">
      <h3>Settings</h3>

      <label>Karakter</label>
      <div class="setting-group">
        <div id="persona-switch" class="segmented-control">
          <button id="btn-male" class="active">Mike</button>
          <button id="btn-female">Kei</button>
        </div>
      </div>

      <label>Bahasa</label>
      <div class="setting-group">
        <div id="lang-switch" class="segmented-control">
          <button id="btn-lang-id" class="active">ID</button>
          <button id="btn-lang-en">EN</button>
        </div>
      </div>

      <label>
        Scale: <span id="val-scale">1.0</span>
        <input type="range" id="slider-scale" min="0.1" max="2.0" step="0.1" value="1.0">
      </label>
      
      <label>
        Position Y: <span id="val-y">0</span>
        <input type="range" id="slider-y" min="-100" max="100" step="1" value="0">
      </label>

      <button id="btn-reset-memory">Reset Memori</button>
      <button id="btn-close-settings">Tutup</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="speech-bubble" class="hidden">
      <p id="bubble-text"></p>
    </div>
    
    <div id="input-area" class="hidden">
      <input type="text" id="chat-input" placeholder="Type something.." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
    
    <script type="module" src="index.js"></script>
  </body>
</html>
